<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>🔑 Login - Auxílio Farmácia</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0a0e1a;
  --bg-card: #131826;
  --border: #334155;
  --primary: #14b8a6;
  --primary-dark: #0d9488;
  --text: #e2e8f0;
  --text-muted: #94a3b8;
}
html, body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; min-height: 100vh; }

.auth-bar {
  background: rgba(10, 14, 26, 0.95);
  border-bottom: 1px solid var(--border);
  padding: 12px 0;
  position: sticky;
  top: 0;
  z-index: 100;
}
.auth-bar-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-icon {
  width: 40px; height: 40px;
  background: var(--primary);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 700;
  color: white;
}
.brand-name { font-size: 16px; font-weight: 700; color: white; }

.hero {
  text-align: center;
  padding: 80px 24px 40px;
  background: radial-gradient(ellipse at top, rgba(20, 184, 166, 0.1) 0%, transparent 60%);
}
.hero h1 {
  font-size: clamp(36px, 6vw, 56px);
  font-weight: 800;
  line-height: 1.1;
  margin-bottom: 16px;
  color: white;
  letter-spacing: -1.5px;
}
.hero p {
  font-size: 18px;
  color: var(--text-muted);
  margin-bottom: 32px;
}

.hero-actions {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}

.btn {
  padding: 14px 28px;
  border-radius: 10px;
  border: none;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.btn-primary {
  background: var(--primary);
  color: white;
  box-shadow: 0 4px 12px rgba(20, 184, 166, 0.3);
}
.btn-primary:hover {
  background: var(--primary-dark);
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(20, 184, 166, 0.4);
}
.btn-ghost {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-ghost:hover {
  background: #1a2030;
  border-color: var(--primary);
}

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);
  z-index: 9999;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.active {
  display: flex;
}
.modal {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px;
  width: 100%;
  max-width: 420px;
  max-height: 90vh;
  overflow-y: auto;
  position: relative;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
}
.modal-close {
  position: absolute;
  top: 14px;
  right: 14px;
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 24px;
  width: 36px;
  height: 36px;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal-close:hover {
  background: var(--border);
  color: white;
}
.modal h2 {
  color: white;
  margin-bottom: 8px;
  font-size: 22px;
}
.modal-subtitle {
  color: var(--text-muted);
  margin-bottom: 24px;
  font-size: 14px;
}
.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 20px;
  background: #0f172a;
  padding: 4px;
  border-radius: 10px;
}
.tab {
  flex: 1;
  padding: 10px;
  background: transparent;
  color: var(--text-muted);
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
}
.tab.active {
  background: var(--primary);
  color: white;
}
.form-group {
  margin-bottom: 14px;
}
.form-group label {
  display: block;
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 6px;
}
.form-input {
  width: 100%;
  padding: 11px 14px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: #0f172a;
  color: white;
  font-size: 14px;
  box-sizing: border-box;
}
.form-input:focus {
  outline: none;
  border-color: var(--primary);
}
.form-error {
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.3);
  color: #fca5a5;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 12px;
  display: none;
}
.form-success {
  background: rgba(20, 184, 166, 0.1);
  border: 1px solid rgba(20, 184, 166, 0.3);
  color: var(--primary);
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 12px;
  display: none;
}
.submit-btn {
  width: 100%;
  padding: 13px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 700;
  font-size: 15px;
}
.submit-btn:hover { background: var(--primary-dark); }
.link-btn {
  background: transparent;
  border: none;
  color: var(--primary);
  font-size: 13px;
  cursor: pointer;
  text-decoration: underline;
  padding: 0;
  margin-top: 12px;
  display: block;
  text-align: center;
  width: 100%;
}
.user-bar {
  display: flex;
  gap: 12px;
  align-items: center;
}
.user-info {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 14px;
  background: var(--bg-card);
  border-radius: 999px;
  border: 1px solid var(--border);
}
.avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--primary);
  display: flex; align-items: center; justify-content: center;
  color: white; font-weight: 700; font-size: 12px;
}
</style>
  <meta name="description" content="Entre ou crie sua conta no Auxilio Farmacia para acessar posologia, calculadoras clinicas e cursos.">

<style>
/* === ACESSIBILIDADE: skip-link + foco visivel === */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 999999;
  background: #031f1c;
  color: #ffffff;
  padding: 12px 20px;
  border-radius: 0 0 8px 0;
  font-weight: 700;
  text-decoration: none;
}
.skip-link:focus {
  left: 0;
  outline: 3px solid #fbbf24;
  outline-offset: 2px;
}
:focus-visible {
  outline: 3px solid #fbbf24;
  outline-offset: 2px;
  border-radius: 4px;
}
[role="button"]:focus-visible,
[role="tab"]:focus-visible,
.tab-btn:focus-visible,
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 3px solid #fbbf24;
  outline-offset: 2px;
}
#conteudo-principal {
  scroll-margin-top: 80px;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>
<a href="#conteudo-principal" class="skip-link">Pular para o conteúdo principal</a>


<div class="auth-bar" id="conteudo-principal">>
  <div class="auth-bar-inner">
    <div class="brand">
      <div class="brand-icon">Rx</div>
      <div class="brand-name">Auxílio Farmácia</div>
    </div>
    <div class="user-bar" id="userBar">
      <a href="dashboard-auxfarmacia-FREE.html" class="btn btn-ghost">📊 Dashboard</a>
      <button class="btn btn-primary" onclick="openModal('login')">🔑 Entrar / Criar conta</button>
    </div>
  </div>
</div>

<section class="hero">
  <h1>Acesso à plataforma</h1>
  <p>Entre ou crie sua conta grátis para acessar todos os recursos.</p>
  <div class="hero-actions">
    <button class="btn btn-primary" onclick="openModal('login')">🔑 Entrar</button>
    <button class="btn btn-ghost" onclick="openModal('register')">✨ Criar conta</button>
  </div>
</section>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">×</button aria-label="×">
    <h2 id="modalTitle">Acesso</h2>
    <p class="modal-subtitle" id="modalSubtitle">Use seu e-mail e senha</p>

    <div class="tabs">
      <button class="tab active" id="tabLogin" onclick="switchTab('login')">Entrar</button>
      <button class="tab" id="tabRegister" onclick="switchTab('register')">Criar conta</button>
    </div>

    <div class="form-error" id="errBox"></div>
    <div class="form-success" id="succBox"></div>

    <!-- LOGIN -->
    <form id="loginForm" onsubmit="event.preventDefault(); doLogin();">
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" id="loginEmail" class="form-input" required>
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="loginPassword" class="form-input" required>
      </div>
      <button type="submit" class="submit-btn">🔓 Entrar</button>
      <button type="button" class="link-btn" onclick="switchTab('forgot')">Esqueci minha senha</button>
    </form>

    <!-- REGISTER -->
    <form id="registerForm" style="display:none;" onsubmit="event.preventDefault(); doRegister();">
      <div class="form-group">
        <label>Nome completo</label>
        <input type="text" id="regName" class="form-input" required minlength="3">
      </div>
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" id="regEmail" class="form-input" required>
      </div>
      <div class="form-group">
        <label>Senha (mín. 6 caracteres)</label>
        <input type="password" id="regPassword" class="form-input" required minlength="6">
      </div>
      <button type="submit" class="submit-btn">✨ Criar conta</button>
      <button type="button" class="link-btn" onclick="switchTab('login')">Já tenho conta</button>
    </form>

    <!-- FORGOT -->
    <form id="forgotForm" style="display:none;" onsubmit="event.preventDefault(); doForgot();">
      <div class="form-group">
        <label>E-mail cadastrado</label>
        <input type="email" id="forgotEmail" class="form-input" required>
      </div>
      <p style="color:var(--text-muted);font-size:13px;margin-bottom:12px;">
        A senha será redefinida para <strong>minhasenha</strong>
      </p>
      <button type="submit" class="submit-btn">📧 Redefinir senha</button>
      <button type="button" class="link-btn" onclick="switchTab('login')">Voltar para login</button>
    </form>
  </div>
</div>

<script>
function hashPwd(pwd) {
  if (!pwd) return '';
  if (pwd.startsWith('h_')) return pwd;
  let hash = 0;
  for (let i = 0; i < pwd.length; i++) {
    hash = ((hash << 5) - hash) + pwd.charCodeAt(i);
    hash = hash & hash;
  }
  return 'h_' + Math.abs(hash).toString(36);
}

function showError(msg) {
  const e = document.getElementById('errBox');
  e.textContent = '❌ ' + msg;
  e.style.display = 'block';
  document.getElementById('succBox').style.display = 'none';
}

function showSuccess(msg) {
  const s = document.getElementById('succBox');
  s.textContent = '✅ ' + msg;
  s.style.display = 'block';
  document.getElementById('errBox').style.display = 'none';
}

function hideMessages() {
  document.getElementById('errBox').style.display = 'none';
  document.getElementById('succBox').style.display = 'none';
}

function openModal(tab) {
  document.getElementById('modal').classList.add('active');
  switchTab(tab || 'login');
  hideMessages();
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
  document.body.style.overflow = '';
}

function switchTab(tab) {
  hideMessages();
  document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
  document.getElementById('forgotForm').style.display = tab === 'forgot' ? 'block' : 'none';
  document.getElementById('tabLogin').classList.toggle('active', tab === 'login' || tab === 'forgot');
  document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
  
  const titles = {
    'login': 'Entrar na sua conta',
    'register': 'Criar conta grátis',
    'forgot': 'Recuperar senha'
  };
  const subs = {
    'login': 'Acesse seu dashboard e continue aprendendo.',
    'register': 'Leva menos de 30 segundos.',
    'forgot': 'Vamos redefinir sua senha.'
  };
  document.getElementById('modalTitle').textContent = titles[tab];
  document.getElementById('modalSubtitle').textContent = subs[tab];
}

function doLogin() {
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const pwd = document.getElementById('loginPassword').value;
  
  if (!email || !pwd) {
    showError('Preencha e-mail e senha.');
    return;
  }
  
  // Admin especial
  if (email === 'admin@auxfarmacia.com.br' && pwd === 'admin123') {
    let users = {};
    try { users = JSON.parse(localStorage.getItem('auxf_users') || '{}'); } catch(e) {}
    if (!users[email]) {
      users[email] = { nome: 'Administrador', email: email, profissao: 'medico', senha: hashPwd('admin123'), plano: 'enterprise', role: 'admin', criado: new Date().toISOString(), expira: null, historico: [] };
      localStorage.setItem('auxf_users', JSON.stringify(users));
    }
    localStorage.setItem('auxf_session', JSON.stringify({ email: email, plano: 'enterprise', expira: null }));
    showSuccess('Login realizado! Redirecionando...');
    setTimeout(() => window.location.href = 'admin.html', 800);
    return;
  }
  
  let users = {};
  try { users = JSON.parse(localStorage.getItem('auxf_users') || '{}'); } catch(e) {}
  const user = users[email];
  
  if (!user) {
    showError('Conta não encontrada. Crie uma conta grátis.');
    return;
  }
  
  const pwdHash = hashPwd(pwd);
  if (user.senha !== pwdHash) {
    showError('Senha incorreta. Tente novamente ou use "Esqueci minha senha".');
    return;
  }
  
  localStorage.setItem('auxf_session', JSON.stringify({ email: email, plano: user.plano || 'free', expira: user.expira }));
  showSuccess('Login realizado! Redirecionando...');
  setTimeout(() => window.location.href = 'dashboard-auxfarmacia-FREE.html', 800);
}

function doRegister() {
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim().toLowerCase();
  const pwd = document.getElementById('regPassword').value;
  
  if (!name || name.length < 3) {
    showError('Nome deve ter pelo menos 3 caracteres.');
    return;
  }
  if (!email || !email.includes('@')) {
    showError('E-mail inválido.');
    return;
  }
  if (!pwd || pwd.length < 6) {
    showError('Senha deve ter pelo menos 6 caracteres.');
    return;
  }
  
  let users = {};
  try { users = JSON.parse(localStorage.getItem('auxf_users') || '{}'); } catch(e) {}
  
  if (users[email]) {
    showError('Já existe uma conta com este e-mail. Faça login.');
    return;
  }
  
  users[email] = {
    nome: name, email: email, profissao: '', crm: '',
    senha: hashPwd(pwd), plano: 'free', criado: new Date().toISOString(),
    expira: null, historico: []
  };
  localStorage.setItem('auxf_users', JSON.stringify(users));
  localStorage.setItem('auxf_session', JSON.stringify({ email: email, plano: 'free', expira: null }));
  
  showSuccess('Conta criada! Bem-vindo(a), ' + name.split(' ')[0] + '!');
  setTimeout(() => window.location.href = 'dashboard-auxfarmacia-FREE.html', 1000);
}

function doForgot() {
  const email = document.getElementById('forgotEmail').value.trim().toLowerCase();
  
  if (!email || !email.includes('@')) {
    showError('E-mail inválido.');
    return;
  }
  
  let users = {};
  try { users = JSON.parse(localStorage.getItem('auxf_users') || '{}'); } catch(e) {}
  
  if (!users[email]) {
    showError('Conta não encontrada com este e-mail.');
    return;
  }
  
  users[email].senha = hashPwd('minhasenha');
  users[email].senhaResetAt = new Date().toISOString();
  localStorage.setItem('auxf_users', JSON.stringify(users));
  
  showSuccess('Senha redefinida para "minhasenha"! Faça login.');
  setTimeout(() => {
    switchTab('login');
    document.getElementById('loginEmail').value = email;
    document.getElementById('loginPassword').value = '';
  }, 1500);
}

// Atualiza userBar
function updateUserBar() {
  const ub = document.getElementById('userBar');
  try {
    const session = JSON.parse(localStorage.getItem('auxf_session') || '{}');
    if (session && session.email) {
      const users = JSON.parse(localStorage.getItem('auxf_users') || '{}');
      const user = users[session.email] || users[session.email.toLowerCase()];
      if (user) {
        const initials = (user.nome || session.email).split(' ').map(p => p[0]).slice(0,2).join('').toUpperCase();
        ub.innerHTML = `
          <div class="user-info">
            <div class="avatar">${initials}</div>
            <span>${escapeHtml(user.nome || session.email.split('@')[0])}</span>
          </div>
          <a href="dashboard-auxfarmacia-FREE.html" class="btn btn-ghost">📊 Dashboard</a>
          <button class="btn btn-ghost" onclick="doLogout()">🚪 Sair</button>
        `;
      }
    }
  } catch(e) {}
}

function doLogout() {
  if (!confirm('Tem certeza que deseja sair?')) return;
  localStorage.removeItem('auxf_session');
  updateUserBar();
  alert('Você saiu da conta. Recarregando...');
  setTimeout(() => location.reload(), 500);
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

// ESC fecha modal
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// Click fora fecha
document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});

document.addEventListener('DOMContentLoaded', updateUserBar);
</script>

</body>
</html>
