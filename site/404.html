<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada — Auxílio Farmácia</title>
<style>
:root{--bg:#0a0e1a;--card:#131826;--line:#334155;--primary:#14b8a6;--ink:#f1f5f9;--muted:#94a3b8}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;
  justify-content:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:36px;max-width:480px;text-align:center}
.code{font-size:56px;font-weight:800;color:var(--primary);line-height:1}
h1{font-size:21px;margin:12px 0 8px}
p{color:var(--muted);font-size:14px;line-height:1.65;margin-bottom:24px}
a{display:inline-block;padding:12px 22px;border-radius:9px;background:var(--primary);color:#fff;
  text-decoration:none;font-weight:700;font-size:14px}
a:hover{background:#0d9488}
</style>
</head>
<body>
<div class="box">
  <div class="code">404</div>
  <h1>Página não encontrada</h1>
  <p>O endereço que você tentou acessar não existe ou foi movido.
     Volte ao início e acesse a plataforma.</p>
  <a href="index.html">🏠 Voltar ao início</a>
</div>
</body>
</html>
